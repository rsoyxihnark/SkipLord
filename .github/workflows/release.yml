name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.3.1). Empty uses the current ref."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module zip
        run: sh scripts/build-release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: One Skip ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            releases/*.zip
            releases/*.sha256
          body: |
            Vortex-ready zip. First folder is `Modules`.

            Extract into the game folder (the one that already has a Modules
            directory), or drop the zip on Vortex.

            Files: `OneSkip.dll` only.

            Requires Harmony enabled above this module.

            Skips splash (TWLogo_and_Partners) and campaign cinematic. Does not skip character creation or the tutorial.

            Delete any older `Modules/OneSkip` folder first.
