name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0). Empty uses the current ref."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module zip
        run: sh scripts/build-release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: One Skip ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist-release/*.zip
            dist-release/*.sha256
          body: |
            Bannerlord module. Unzip so `Modules/OneSkip/SubModule.xml` exists.

            Requires Harmony. Skips splash and campaign cinematic only.

