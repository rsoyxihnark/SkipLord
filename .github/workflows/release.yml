name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check pushed commits
        id: plan
        run: python3 scripts/release-gate.py plan "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.publish && 'Publish' || 'Build' }} v${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build SkipLord.dll
        run: |
          dotnet build module-src/SkipLord.csproj -c Release
          mkdir -p module/SkipLord/bin/Win64_Shipping_Client
          cp -f module-src/bin/SkipLord.dll module/SkipLord/bin/Win64_Shipping_Client/SkipLord.dll

      - name: Build module zip
        run: sh scripts/build-release.sh

      - name: Check version stamp
        run: python3 scripts/release-gate.py stamp "releases/SkipLord-v${{ matrix.version }}.zip"

      - name: Write release notes
        if: matrix.publish
        run: python3 scripts/release-gate.py notes "${{ matrix.sha }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: matrix.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ matrix.version }}
          target_commitish: ${{ matrix.sha }}
          name: SkipLord v${{ matrix.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            releases/SkipLord-v${{ matrix.version }}.zip
            releases/SkipLord-v${{ matrix.version }}.zip.sha256
